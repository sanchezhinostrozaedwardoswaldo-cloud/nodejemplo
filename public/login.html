
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | NodeShop</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <script src="./js/tema.js" defer></script>
    <script src="./js/login.js" defer></script>
    <link rel="stylesheet" href="./css/redisenio.css">
    <link rel="stylesheet" href="./css/temas.css">
</head>
<body>
    <main class="contenedor">
        <form id="formLogin" class="formulario">
            <a class="enlace-volver" href="/">← Volver a la tienda</a>
            <h1>Iniciar sesión</h1>
            <p>Ingresa tus credenciales para continuar</p>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" required
                   autocomplete="email">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required
                   autocomplete="current-password">

            <button type="submit">Ingresar</button>

            <p id="mensaje" class="mensaje" role="status"></p>

            <div class="tema-auth"><label for="selectorTema">Apariencia</label><select id="selectorTema" data-selector-tema><option value="auto">Automático</option><option value="oscuro">Oscuro</option><option value="claro">Claro</option></select></div>
            <p>¿No tienes una cuenta?
                <a href="registro.html">Regístrate</a>
            </p>
        </form>
    </main>
</body>
</html>
